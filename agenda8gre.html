<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08703f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agenda 8ª GRE">
  <title>Agenda 8ª GRE</title>
  <link rel="manifest" href="/agenda8gre-manifest.json">
  <link rel="icon" href="/agenda8gre-icon-192.png">
  <link rel="apple-touch-icon" href="/agenda8gre-icon-192.png">
  <style>
    :root{--green:#08703f;--green2:#075a35;--bg:#f4f7f6;--text:#173127;--muted:#6d7c75;--line:#dfe8e4}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{display:flex;flex-direction:column}
    .hidden{display:none!important}
    .topbar{height:70px;flex:0 0 70px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);gap:10px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand img{width:46px;height:46px;border-radius:12px}
    .brand div{display:flex;flex-direction:column;min-width:0}
    .brand strong{font-size:1rem}
    .brand span{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;gap:8px}
    button{font:inherit;cursor:pointer}
    .icon-btn{border:1px solid #cdded6;background:#eef8f3;color:var(--green);border-radius:11px;padding:10px 12px;font-weight:800}
    .screen{flex:1;min-height:0;position:relative}
    .setup{height:100%;display:grid;place-items:center;padding:18px}
    .card{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(20,55,40,.08)}
    .card .emoji{font-size:2rem;text-align:center}.card h1{text-align:center;margin:8px 0}.card p{text-align:center;color:var(--muted);line-height:1.5}
    label{display:block;margin-top:18px;margin-bottom:6px;font-size:.75rem;font-weight:800}
    input{width:100%;padding:14px;border:1px solid #cfded6;border-radius:12px;font:inherit;outline:none}
    input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(8,112,63,.10)}
    .primary{width:100%;margin-top:10px;border:0;border-radius:12px;padding:13px;background:var(--green);color:#fff;font-weight:900}
    .hint{font-size:.69rem!important;margin:10px 0 0!important}
    .error{margin-top:10px;padding:10px 12px;border:1px solid #efc9c5;background:#fff3f2;color:#94392f;border-radius:10px;font-size:.74rem}
    .viewer{position:fixed;inset:0;z-index:50;background:#fff}
    .viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    .floating-tools{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:80;display:flex;gap:8px}
    .floating-btn{width:42px;height:42px;border:1px solid rgba(8,112,63,.25);border-radius:50%;background:rgba(255,255,255,.92);color:#08703f;font-size:1.05rem;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.12);backdrop-filter:blur(6px)}
    .floating-btn:active{transform:scale(.96)}
    .config-btn::after{content:'Link';position:absolute;right:48px;top:8px;background:rgba(255,255,255,.94);border:1px solid #d9e6df;border-radius:9px;padding:5px 8px;font-size:.65rem;color:#496459;box-shadow:0 3px 10px rgba(0,0,0,.08)}
    .floating-btn{position:relative}
    @media(max-width:600px){
      .topbar{height:64px;flex-basis:64px;padding:8px 9px}.brand img{width:42px;height:42px}.brand strong{font-size:.92rem}.brand span{font-size:.63rem}
      .icon-btn{padding:8px 9px;font-size:.68rem}.card{padding:22px 15px}
    }
  </style>
</head>
<body>
  <header id="setupHeader" class="topbar">
    <div class="brand">
      <img src="/agenda8gre-icon-192.png" alt="">
      <div>
        <strong>Agenda 8ª GRE</strong>
        <span>Agendamentos dos motoristas • v0.9.3</span>
      </div>
    </div>
  </header>

  <main class="screen">
    <section id="setupView" class="setup">
      <div class="card">
        <div class="emoji">🔗</div>
        <h1>Configurar agenda</h1>
        <p>Cole o link de acesso dos motoristas. Você fará isso somente uma vez neste aparelho.</p>

        <label for="linkInput">Link do agendamento</label>
        <input id="linkInput" type="url" inputmode="url" autocomplete="off"
          placeholder="https://portal8gre-one.vercel.app/motoristas?acesso=...">

        <button id="saveBtn" class="primary" type="button">Salvar e abrir agenda</button>
        <div id="errorBox" class="error hidden"></div>
        <p class="hint">O aplicativo guarda o endereço completo neste aparelho e, nas próximas vezes, abre direto nos agendamentos.</p>
      </div>
    </section>

    <section id="viewerView" class="viewer hidden">
      <iframe id="agendaFrame" title="Agenda de agendamentos dos motoristas" allow="fullscreen"></iframe>
      <div class="floating-tools">
        <button id="reloadBtn" class="floating-btn" type="button" title="Atualizar">↻</button>
        <button id="changeBtn" class="floating-btn config-btn" type="button" title="Configurar link">⚙</button>
      </div>
    </section>
  </main>

  <script>
  (()=> {
    const STORAGE_KEY='agenda8gre_full_url_v1';
    const $=s=>document.querySelector(s);

    function isValidLink(value){
      try{
        const url=new URL(String(value||'').trim());
        return /^https:$/.test(url.protocol)
          && url.hostname.endsWith('vercel.app')
          && url.pathname.includes('/motoristas')
          && !!url.searchParams.get('acesso');
      }catch{
        return false;
      }
    }

    function showSetup(){
      $('#viewerView').classList.add('hidden');
      $('#setupView').classList.remove('hidden');
      $('#setupHeader').classList.remove('hidden');
      $('#agendaFrame').src='about:blank';
      setTimeout(()=>$('#linkInput').focus(),100);
    }

    function showAgenda(url){
      $('#setupView').classList.add('hidden');
      $('#setupHeader').classList.add('hidden');
      $('#viewerView').classList.remove('hidden');
      $('#agendaFrame').src=url;
    }

    function saveLink(){
      const value=$('#linkInput').value.trim();
      const error=$('#errorBox');
      if(!isValidLink(value)){
        error.textContent='Cole o link completo dos motoristas, contendo /motoristas e ?acesso=...';
        error.classList.remove('hidden');
        return;
      }
      localStorage.setItem(STORAGE_KEY,value);
      error.classList.add('hidden');
      showAgenda(value);
    }

    $('#saveBtn').addEventListener('click',saveLink);
    $('#linkInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveLink();});
    $('#reloadBtn').addEventListener('click',()=>{
      const f=$('#agendaFrame');
      const url=localStorage.getItem(STORAGE_KEY);
      if(url){ f.src='about:blank'; setTimeout(()=>f.src=url,50); }
    });
    $('#changeBtn').addEventListener('click',()=>{
      localStorage.removeItem(STORAGE_KEY);
      $('#linkInput').value='';
      showSetup();
    });

    const params=new URLSearchParams(location.search);
    if(params.get('configurar')==='1'){
      localStorage.removeItem(STORAGE_KEY);
      history.replaceState({},'',location.pathname+'?v=093');
      showSetup();
    }else{
      const saved=localStorage.getItem(STORAGE_KEY);
      if(saved && isValidLink(saved)) showAgenda(saved);
      else showSetup();
    }

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/agenda8gre-sw.js',{scope:'/agenda8gre'}).catch(()=>{});
    }
  })();
  </script>
</body>
</html>
